name: Release image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish immutable image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Verify version tag matches package
        id: version
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          tag="${GITHUB_REF_NAME#v}"
          test "$tag" = "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set image build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ github.sha }}

      - name: Build and publish image with SBOM and provenance
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.version.outputs.value }}
          sbom: true
          provenance: mode=max

      - name: Scan published image digest
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Record release identity
        shell: bash
        run: |
          {
            echo '### Published container image'
            echo
            echo "- Version: \`${{ steps.version.outputs.value }}\`"
            echo "- Source commit: \`${GITHUB_SHA}\`"
            echo "- Image digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- SBOM and BuildKit provenance: attached to the published OCI image"
          } >> "$GITHUB_STEP_SUMMARY"
