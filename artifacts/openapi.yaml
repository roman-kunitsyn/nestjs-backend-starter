openapi: 3.1.0
paths:
  /api/v1:
    get:
      operationId: getStarterMessage
      parameters: []
      responses:
        "200":
          description: The starter response.
          content:
            application/json:
              schema:
                type: string
                example: Hello World!
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "400":
          description: Request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "500":
          description: Unexpected server error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
      summary: Get the starter message
      tags:
        - starter
info:
  title: NestJS Backend Starter API
  description: REST API contract for the NestJS backend starter.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        requestId:
          type: string
        detail:
          type: string
        issues:
          type: array
          items:
            type: object
            required:
              - path
              - code
              - message
            properties:
              path:
                type: array
                items:
                  type: string
              code:
                type: string
              message:
                type: string
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
