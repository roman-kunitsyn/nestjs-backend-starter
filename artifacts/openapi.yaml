  /api/v1/organizations/{organizationId}/resources:
    post:
      operationId: createExampleResource
      parameters:
        - name: organizationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type:
                    - string
                    - "null"
                  maxLength: 10000
              additionalProperties: false
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - organizationId
                  - createdByMembershipId
                  - title
                  - description
                  - status
                  - createdAt
                  - updatedAt
                properties:
                  id:
                    type: string
                    format: uuid
                  organizationId:
                    type: string
                    format: uuid
                  createdByMembershipId:
                    type: string
                    format: uuid
                  title:
                    type: string
                    maxLength: 200
                  description:
                    type:
                      - string
                      - "null"
                  status:
                    type: string
                    enum:
                      - active
                      - archived
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "400":
          description: Invalid body, organization, or Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "403":
          description: Resource creation is not permitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "409":
          description: The idempotency key was used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
      security: &a6
        - bearer: []
      summary: Create a resource
      tags: &a7
        - Example resources
    get:
      operationId: listExampleResources
      parameters:
        - name: organizationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
        - name: q
          required: false
          in: query
          schema:
            type: string
            maxLength: 200
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - active
              - archived
        - name: order
          required: false
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: sort
          required: false
          in: query
          schema:
            type: string
            enum:
              - createdAt
            default: createdAt
        - name: cursor
          required: false
          in: query
          schema:
            type: string
            maxLength: 2048
        - name: limit
          required: false
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pageInfo
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - organizationId
                        - createdByMembershipId
                        - title
                        - description
                        - status
                        - createdAt
                        - updatedAt
                      properties:
                        id:
                          type: string
                          format: uuid
                        organizationId:
                          type: string
                          format: uuid
                        createdByMembershipId:
                          type: string
                          format: uuid
                        title:
                          type: string
                          maxLength: 200
                        description:
                          type:
                            - string
                            - "null"
                        status:
                          type: string
                          enum:
                            - active
                            - archived
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  pageInfo:
                    type: object
                    required:
                      - hasNextPage
                      - nextCursor
                    properties:
                      hasNextPage:
                        type: boolean
                      nextCursor:
                        type:
                          - string
                          - "null"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
        "401":
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
