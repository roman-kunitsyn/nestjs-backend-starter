info:
  title: NestJS Backend Starter API
  description: REST API contract for the NestJS backend starter.
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        requestId:
          type: string
        detail:
          type: string
        issues:
          type: array
          items:
            type: object
            required:
              - path
              - code
              - message
            properties:
              path:
                type: array
                items:
                  type: string
              code:
                type: string
              message:
                type: string
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
