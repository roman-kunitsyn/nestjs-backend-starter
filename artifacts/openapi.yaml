  /api/v1/organizations:
    post:
      operationId: createOrganization
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                  maxLength: 200
                slug:
                  type: string
                  maxLength: 100
              additionalProperties: false
      responses:
        "201":
          description: Organization and OWNER membership created atomically.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - slug
                  - status
                  - createdAt
                  - updatedAt
                  - membership
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                    maxLength: 200
                  slug:
                    type: string
                    maxLength: 100
                  status:
                    type: string
                    enum:
                      - active
                      - suspended
                      - archived
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  membership:
                    type: object
                    required:
                      - id
                      - role
                      - status
                    properties:
                      id:
                        type: string
                        format: uuid
                      role:
                        type: string
                        enum:
                          - OWNER
                      status:
                        type: string
                        enum:
                          - active
                          - suspended
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
      security: &a2
        - bearer: []
      summary: Create an organization
      tags: &a3
        - Organizations
    get:
      operationId: listOrganizations
      parameters: []
      responses:
        "200":
          description: Organizations the authenticated user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - slug
                    - status
                    - createdAt
                    - updatedAt
                    - membership
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                      maxLength: 200
                    slug:
                      type: string
                      maxLength: 100
                    status:
                      type: string
                      enum:
                        - active
                        - suspended
                        - archived
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    membership:
                      type: object
                      required:
                        - id
                        - role
                        - status
                      properties:
                        id:
                          type: string
                          format: uuid
                        role:
                          type:
                            - string
                            - "null"
                        status:
                          type: string
                          enum:
                            - active
                            - suspended
          headers:
            X-Request-ID:
              description: Request correlation identifier.
              schema:
                type: string
      security: *a2
      summary: List the current user’s organizations
      tags: *a3
