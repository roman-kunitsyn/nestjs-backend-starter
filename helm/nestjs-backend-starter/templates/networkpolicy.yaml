{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "starter.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "starter.selectors" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
      from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 12 }}
  egress:
    - to:
        {{- range .Values.networkPolicy.databaseIpBlocks }}
        - ipBlock:
            cidr: {{ .cidr | quote }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.databaseNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.databasePodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- if .Values.networkPolicy.smtpIpBlocks }}
    - ports:
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 465
      to:
        {{- range .Values.networkPolicy.smtpIpBlocks }}
        - ipBlock:
            cidr: {{ .cidr | quote }}
            {{- with .except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
