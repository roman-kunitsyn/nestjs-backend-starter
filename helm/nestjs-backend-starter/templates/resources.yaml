apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "starter.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "starter.selectors" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "starter.selectors" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "starter.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ include "starter.image" . | quote }}
          ports:
            - {name: http, containerPort: {{ .Values.config.port }}}
          envFrom:
            - configMapRef: {name: {{ include "starter.fullname" . }}}
            - secretRef: {name: {{ .Values.secretName }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health/startup, port: http}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "starter.fullname" . }}
spec:
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
  selector:
    {{- include "starter.selectors" . | nindent 4 }}
